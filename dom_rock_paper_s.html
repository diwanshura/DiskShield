<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boolean</title>
</head>

<style>
body{
    background-color: rgb(19, 3, 3);
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;   /* horizontal center */
    justify-content: center; /* vertical center */
    height: 100vh;
    margin: 0;
}

.title{
    font-size: 30px;
    font-weight: bold;
}

.emoji{
    height: 70px;
}

.css_emoji{
    background-color: transparent;
    border: 3px solid white;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-right: 10px;
    cursor: pointer;
}

.css_result{
    font-size: 25px;
    font-weight: bold;
    margin-top: 50px;
}

.css_score{
    margin-top: 60px;
}


.reset{
    background-color: rgb(29, 91, 79);
    height: 40px;
    width: 150px;
    border: solid black;
    border-radius: 50px;
    cursor: pointer;
}
.buttons{
    display: flex;
    justify-content: center; /* center horizontally */
    align-items: center;
    gap: 15px; /* space between buttons */
    margin-top: 20px;
}
</style>

<body>

<p class="title">Rock Paper Scissors</p>

<!-- ROCK BUTTON -->
<button class="css_emoji"
onclick="

const randomNumber=Math.random();
// Math.random gives value between 0 to 1

let computerMove='';

if(randomNumber>=0 && randomNumber<1/3){
    computerMove='rock';
}
else if(randomNumber>=1/3 && randomNumber<2/3){
    computerMove='paper';
}
else{
    computerMove='scissors';
}

let result='';

if(computerMove==='rock'){
    result='Tie';
}
else if(computerMove==='paper'){
    result='you lose';
}
else{
    result='You win';
}

if(result=='You win'){
    score.win+=1;
}
else if(result=='you lose'){
    score.loos+=1;
}
else if(result=='Tie'){
    score.tie+=1;
}

// here we are going to store the result in the local storage
// so after refreshing the page our score values do not vanish
// but localStorage only takes string so we use JSON to convert it

localStorage.setItem('score', JSON.stringify(score));
// it updates the wins every click

updateScore();

// for updating the result and the move

document.querySelector('.js-result').innerHTML = result;

document.querySelector('.js-move').innerHTML =
`You
<img src='rock-emoji.png' class='emoji'>
<img src='${computerMove}-emoji.png' class='emoji'>
Computer`;
">
<img src="rock-emoji.png" class="emoji">
</button>

<img src="paper-emoji.png" class="emoji">
</button>


<!-- SCISSORS BUTTON -->
<button class="css_emoji"
onclick="

const randomNumber2=Math.random();
// Math.random gives value between 0 to 1

let computerMove2='';

if(randomNumber2>=0 && randomNumber2<1/3){
    computerMove2='rock';
}
else if(randomNumber2>=1/3 && randomNumber2<2/3){
    computerMove2='paper';
}
else{
    computerMove2='scissors';
}

let result2='';

if(computerMove2==='scissors'){
    result2='Tie';

    result2='You lose';

    result2='you win';

if(result2=='you win'){
    score.win+=1;
}

    score.loos+=1;

    score.tie+=1;

<img src='scissors-emoji.png' class='emoji'>
<img src='${computerMove2}-emoji.png' class='emoji'>
Computer`;
">
<img src="scissors-emoji.png" class="emoji">
</button>


<!-- this p used to display the win in the page not in alert -->
<p class="js-result css_result"></p>
<p class="js-move"></p>
<p class="js-score css_score"></p>


<button class="reset"
onclick="
score.win=0;
score.loos=0;
score.tie=0;

localStorage.removeItem('score');
// remove score from localStorage

updateScore();

document.querySelector('.js-result').innerHTML='Result is reset';
document.querySelector('.js-move').innerHTML='';
">
Reset Score
</button>


<script>

// using objects to count wins and loss
const score=JSON.parse(localStorage.getItem('score'))||{
    win:0,
    loos:0,
    tie:0
};

// at the last we stored value as string
// now we convert it back to object using JSON.parse

updateScore();

/////////////////////// using code the DOM ///////////////////
function updateScore(){
    document.querySelector('.js-score').innerHTML=
    `wins:${score.win}, loss:${score.loos}, tie:${score.tie}`;
}

</script>

</body>
</html>
